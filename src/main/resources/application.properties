spring.application.name=idilio-app
# ============================================================
#  CONFIGURACIÓN DEL SERVIDOR
# ============================================================
server.port=8080

# ============================================================
#  CONEXIÓN A SUPABASE (POSTGRESQL)
# ============================================================
# Reemplaza <tu-host>, <tu-usuario> y <tu-contraseña> con los datos reales
# El host suele ser algo como: db.xxxxxx.supabase.co
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?ssl=true&sslmode=require
spring.datasource.username=postgres.rehpdfqqzvncbrqaeyyp
spring.datasource.password=71K0M%t5'$j@
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  CONFIGURACIÓN DE HIKARI (Pool de conexiones)
# ============================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
#  JPA (HIBERNATE)
# ============================================================
# Dialecto para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actualiza automáticamente el esquema (¡cuidado en producción!)
spring.jpa.hibernate.ddl-auto=none

# Muestra las consultas SQL en consola (útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
#  THYMELEAF (Para desarrollo)
# ============================================================
# Desactiva la caché para ver cambios en tiempo real
spring.thymeleaf.cache=false

# ============================================================
#  LOGGING (Para ver más detalles)
# ============================================================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE